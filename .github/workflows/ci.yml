name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # husky's prepare script has nothing to install in CI
      - run: npm ci --ignore-scripts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
