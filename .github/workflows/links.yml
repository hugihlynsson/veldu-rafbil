name: Links

# Most corrections to the car data have been a link that stopped working, and
# nothing else notices one before a visitor does
on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Broken car links
    steps:
      - uses: actions/checkout@v5

      # A dealer site that turns bots away answers 403 whether or not the page
      # is there, so only an answer that says the page is gone is reported.
      # ev-database is most of the list, so it is asked slowly.
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept '200..=299,403,429'
            --host-concurrency 2
            --host-request-interval 1s
            --max-retries 3
            --timeout 30
            modules/newCars.ts
          fail: false

      # One issue, updated each week until the links are fixed
      - id: open
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" \
            --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: ${{ env.TITLE }}
          content-filepath: lychee/out.md
          issue-number: ${{ steps.open.outputs.number }}

      - if: steps.lychee.outputs.exit_code == 0 && steps.open.outputs.number
        run: >-
          gh issue close ${{ steps.open.outputs.number }}
          --comment 'Every link in modules/newCars.ts answers again.'
